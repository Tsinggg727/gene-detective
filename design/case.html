  /* ---------- 案件一：质控修剪 ---------- */
  function buildTrim(d) {
    var node = pageHead('ACTION · 选出低质量区段');
    var wrap = h('div', 'qz-body');

    var grid = h('div', 'seq-grid');
    var cells = [], sel = [];
    d.read.split('').forEach(function (b, i) {
      var q = d.qualities[i];
      var c = h('span', 'bc qg ' + (q >= 28 ? 'g' : q >= 20 ? 'm' : 'l'));
      c.appendChild(h('span', 'lt', b));
      var bar = h('i', 'qb');
      bar.style.height = (5 + Math.min(q, 40) / 40 * 21).toFixed(1) + 'px';
      c.appendChild(bar);
      c.appendChild(h('span', 'qn', String(q)));
      c.addEventListener('click', function () { tap(i); });
      cells.push(c);
      grid.appendChild(c);
    });
    wrap.appendChild(grid);

    var legend = h('div', 'q-legend');
    legend.innerHTML = '<span><i class="g"></i>Q ≥ 28 · 可信</span>' +
      '<span><i class="m"></i>20–27 · 存疑</span>' +
      '<span><i class="l"></i>Q &lt; 20 · 该剪</span>';
    wrap.appendChild(legend);

    var note = h('p', 'seq-note', '点两个字母：第一下起点，第二下终点。');
    wrap.appendChild(note);
    node.appendChild(wrap);

    var fbf = h('p', 'fbf');
    node.appendChild(fbf);

    function range() {
      if (!sel.length) return null;
      if (sel.length === 1) return [sel[0], sel[0]];
      return [Math.min(sel[0], sel[1]), Math.max(sel[0], sel[1])];
    }
    function paint() {
      var r = range();
      cells.forEach(function (c, i) { c.classList.toggle('sel', !!r && i >= r[0] && i <= r[1]); });
      if (!r) note.textContent = '点两个字母：第一下起点，第二下终点。';
      else if (sel.length === 1) note.textContent = '起点：第 ' + (r[0] + 1) + ' 位 —— 再点一下终点。';
      else note.textContent = '已选：第 ' + (r[0] + 1) + '–' + (r[1] + 1) + ' 位，共 ' + (r[1] - r[0] + 1) + ' 个字母。';
      clearErr(fbf);
    }
    function tap(i) {
      if (sel.length === 2) sel = [];
      if (!sel.length) sel = [i];
      else if (sel[0] === i) sel = [];
      else sel.push(i);
      paint();
    }

    addPage(node, {
      lead: LEAD[1],
      hint: '选中一段低质量区段后提交 · 点完格子还能改',
      nextLabel: '提交修剪',
      onEnter: function () { paint(); },
      onNext: function () {
        var r = range();
        if (!r || sel.length < 2) { showErr(fbf, '还没选好——先点两个字母，框出一段要剪掉的位置。'); return; }
        var bp = r[1] - r[0] + 1;
        judge('/levels/1/judge', { start: r[0], end: r[1] }, function (resp) {
          var x = resp.result || {};
          var q = (x.avgQBefore != null && x.avgQAfter != null)
            ? ' · 平均 Q ' + x.avgQBefore + ' → ' + x.avgQAfter : '';
          return '修剪 ' + bp + ' bp · 保留 ' + (d.read.length - bp) + ' bp' + q;
        });
      }
    });
  }

  /* ---------- 案件二：动态规划比对（Needleman–Wunsch 教学版） ---------- */
  function buildAlign(d) {
    var node = pageHead('ACTION · 填表 + 回溯，让算法定位缺口');
    var wrap = h('div', 'qz-body');
    var W = d.window, refw = W.refSeq, patw = W.patSeq;
    var m = refw.length, n = patw.length;
    var SC = d.scoring, NEG = -9999;

    /* 本地按同一套规则把矩阵算一遍。
       题面给的是规则，玩家要做的是执行它——所以这里算的是「正确答案」，
       只为逐格即时反馈；提交后服务端会用同一份数据独立复算，防止前端伪造。 */
    var F = [], best = {};
    for (var i = 0; i <= m; i++) {
      F.push([]);
      for (var j = 0; j <= n; j++) F[i].push(NEG);
    }
    F[0][0] = 0;
    for (i = 1; i <= m; i++) F[i][0] = F[i - 1][0] + SC.gap;
    for (j = 1; j <= n; j++) F[0][j] = F[0][j - 1] + SC.gap;
    for (i = 1; i <= m; i++) {
      for (j = 1; j <= n; j++) {
        var sc = refw.charAt(i - 1) === patw.charAt(j - 1) ? SC.match : SC.mismatch;
        var cand0 = { D: F[i - 1][j - 1] + sc, U: F[i - 1][j] + SC.gap, L: F[i][j - 1] + SC.gap };
        var mx = Math.max(cand0.D, cand0.U, cand0.L);
        F[i][j] = mx;
        best[i + ',' + j] = ['D', 'U', 'L'].filter(function (k) { return cand0[k] === mx; });
      }
    }

    function num(v) { return v < 0 ? '−' + Math.abs(v) : String(v); }
    function sgn(v) { return (v < 0 ? '− ' : '+ ') + Math.abs(v); }
    var AR = { D: '↖', U: '↑', L: '←' };
    var NAME = { D: '对角', U: '上格', L: '左格' };

    /* ---------- 窗口序列（一行紧凑展示，把高度让给矩阵） ---------- */
    var ctx = h('div', 'dp-ctx');
    ctx.appendChild(h('span', 'lbl', '参考 ' + (W.refStart + 1) + '–' + (W.refStart + m) + ' 位'));
    refw.split('').forEach(function (b) {
      var c = h('span', 'bc');
      c.appendChild(h('span', 'lt', b));
      ctx.appendChild(c);
    });
    ctx.appendChild(h('span', 'lbl', '患者同起点'));
    patw.split('').forEach(function (b) {
      var c = h('span', 'bc');
      c.appendChild(h('span', 'lt', b));
      ctx.appendChild(c);
    });
    ctx.appendChild(h('span', 'lbl', '少 ' + (m - n) + ' 个字母'));
    wrap.appendChild(ctx);

    /* ---------- 矩阵 ---------- */
    var dpLab = h('p', 'seq-label');
    dpLab.style.marginTop = '12px';
    dpLab.appendChild(h('b', null, '打分矩阵'));
    dpLab.appendChild(document.createTextNode('行 = 参考字母 · 列 = 患者字母 · 空行空列是起手'));

    var scroll = h('div', 'dp-scroll');
    var table = document.createElement('table');
    table.className = 'dp';
    var thead = document.createElement('thead');
    var htr = document.createElement('tr');
    htr.appendChild(h('th', null, ''));
    htr.appendChild(h('th', null, ''));
    patw.split('').forEach(function (b) { htr.appendChild(h('th', 'sq', b)); });
    thead.appendChild(htr);
    table.appendChild(thead);
    var tbody = document.createElement('tbody');
    var cells = {};
    for (i = 0; i <= m; i++) {
      var tr = document.createElement('tr');
      tr.appendChild(h('th', i === 0 ? null : 'sq', i === 0 ? '' : refw.charAt(i - 1)));
      var b0 = h('td', 'bord', num(F[i][0]));
      b0.setAttribute('data-i', i);
      b0.setAttribute('data-j', 0);
      cells[i + ',0'] = b0;
      tr.appendChild(b0);
      for (j = 1; j <= n; j++) {
        var td = document.createElement('td');
        td.className = i === 0 ? 'bord' : 'cell';
        td.textContent = i === 0 ? num(F[0][j]) : '';
        td.setAttribute('data-i', i);
        td.setAttribute('data-j', j);
        cells[i + ',' + j] = td;
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    scroll.appendChild(table);

    var legend = h('div', 'dp-legend');
    legend.innerHTML = '<span><i class="f"></i>起手（只垫 gap）</span>' +
      '<span><i class="d"></i>你填的格</span>' +
      '<span><i class="p"></i>回溯路径</span>';
    var note = h('p', 'seq-note', '');
    add(wrap, dpLab, scroll, legend, note);

    var candBox = h('div');
    wrap.appendChild(candBox);
    node.appendChild(wrap);

    var fbf = h('p', 'fbf');
    node.appendChild(fbf);

    /* ---------- 状态机：先填表，再回溯 ---------- */
    var dirs = {}, filled = 0, phase = 'fill';
    var path = [], curCell = null;
    var order = [];
    for (i = 1; i <= m; i++) for (j = 1; j <= n; j++) order.push([i, j]);

    function focusOf() {
      for (var q = 0; q < order.length; q++) {
        var key = order[q][0] + ',' + order[q][1];
        if (!dirs[key]) return order[q];
      }
      return null;
    }

    function baseCls(ci, cj) { return (ci === 0 || cj === 0) ? 'bord' : 'cell'; }

    function paint() {
      Object.keys(cells).forEach(function (key) {
        var ij = key.split(','), ci = +ij[0], cj = +ij[1];
        var td = cells[key];
        td.className = baseCls(ci, cj);
        td.innerHTML = '';
        td.appendChild(document.createTextNode(num(F[ci][cj])));
        if (dirs[key]) {
          td.className = baseCls(ci, cj) + ' done';
          td.appendChild(h('span', 'ar', AR[dirs[key]]));
        }
      });
      if (phase === 'fill') {
        var f = focusOf();
        if (f) cells[f[0] + ',' + f[1]].className = 'cell foc';
        return;
      }
      /* 回溯阶段：每一格都可点（含第 0 行 / 第 0 列） */
      Object.keys(cells).forEach(function (key) {
        var ij = key.split(','), ci = +ij[0], cj = +ij[1];
        if (cells[key].className.indexOf('foc') >= 0) return;
        cells[key].className = baseCls(ci, cj) + (dirs[key] ? ' done' : '') + ' pick';
      });
      path.forEach(function (p) {
        var td = cells[p[0] + ',' + p[1]];
        if (td) td.className = 'cell done path';
      });
      if (path.length) {
        var lc = path[path.length - 1];
        var c1 = cells[lc[0] + ',' + lc[1]];
        if (c1) c1.className = 'cell done cur';
      }
    }

    function renderCands() {
      candBox.innerHTML = '';
      if (phase !== 'fill') { renderPathHint(); return; }
      var f = focusOf();
      if (!f) return;
      var ci = f[0], cj = f[1];
      var sc = refw.charAt(ci - 1) === patw.charAt(cj - 1) ? SC.match : SC.mismatch;
      var opts = {
        D: { from: F[ci - 1][cj - 1], delta: sc, txt: num(F[ci - 1][cj - 1]) + ' ' + sgn(sc) },
        U: { from: F[ci - 1][cj], delta: SC.gap, txt: num(F[ci - 1][cj]) + ' ' + sgn(SC.gap) },
        L: { from: F[ci][cj - 1], delta: SC.gap, txt: num(F[ci][cj - 1]) + ' ' + sgn(SC.gap) }
      };
      var lab = h('p', 'seq-label');
      lab.style.marginTop = '12px';
      lab.appendChild(h('b', null, '第 ' + ci + ' 行 · 第 ' + cj + ' 列'));
      lab.appendChild(document.createTextNode(patw.charAt(cj - 1) + ' 对 ' + refw.charAt(ci - 1) + ' —— 三个候选取最大的那个'));
      candBox.appendChild(lab);

      var row = h('div', 'cand-row');
      ['D', 'U', 'L'].forEach(function (dir) {
        var o = opts[dir];
        var b = h('button', 'cand');
        b.type = 'button';
        b.appendChild(h('span', 'tag', AR[dir] + ' ' + NAME[dir]));
        b.appendChild(h('b', null, num(o.from + o.delta)));
        b.appendChild(h('i', null, o.txt));
        b.addEventListener('click', function () {
          if (best[ci + ',' + cj].indexOf(dir) >= 0) {
            dirs[ci + ',' + cj] = dir;
            filled++;
            clearErr(fbf);
            if (filled >= m * n) {           // 表填满了，进入回溯
              phase = 'back';
              path = [[m, n]];
            }
            paint();
            renderCands();
          } else {
            b.classList.add('bad');
            setTimeout(function () { b.classList.remove('bad'); }, 320);
            showErr(fbf, '这一格最大的不是它——三个候选分数都写在按钮上，比一比谁高。');
          }
        });
        row.appendChild(b);
      });
      candBox.appendChild(row);
      note.textContent = '已填 ' + filled + ' / ' + (m * n) + ' 格';
    }

    function renderPathHint() {
      var lab = h('p', 'seq-label');
      lab.style.marginTop = '12px';
      lab.appendChild(h('b', null, '回溯'));
      lab.appendChild(document.createTextNode('从右下角走到左上角：点出当前格的前一个格'));
      candBox.appendChild(lab);
      var tip = h('p', 'seq-note');
      var last = path[path.length - 1];
      var b2 = best[last[0] + ',' + last[1]] || [];
      tip.textContent = '当前格 (' + last[0] + ', ' + last[1] + ') 的最优方向：' +
        b2.map(function (k) { return AR[k] + NAME[k]; }).join(' / ') +
        '　—— 点对应的那一格';
      candBox.appendChild(tip);
      note.textContent = '路径 ' + path.length + ' 步';
    }

    Object.keys(cells).forEach(function (key) {
      cells[key].addEventListener('click', function () {
        if (phase !== 'back' ) return;
        var ij = key.split(',');
        var ci = +ij[0], cj = +ij[1];
        var last = path[path.length - 1];
        if (!last) return;
        var step = (ci === last[0] - 1 && cj === last[1] - 1) ? 'D'
          : (ci === last[0] - 1 && cj === last[1]) ? 'U'
            : (ci === last[0] && cj === last[1] - 1) ? 'L' : null;
        if (!step || best[last[0] + ',' + last[1]].indexOf(step) < 0) {
          showErr(fbf, '这一步不在最优路径上——只能往左上、上、左三个方向走，而且必须是最优方向。');
          return;
        }
        clearErr(fbf);
        path.push([ci, cj]);
        paint();
        candBox.innerHTML = '';
        if (ci === 0 && cj === 0) { phase = 'done'; renderDone(); }
        else renderPathHint();
      });
    });

    function renderDone() {
      var lab = h('p', 'seq-label');
      lab.style.marginTop = '12px';
      lab.appendChild(h('b', null, '回溯完成'));
      lab.appendChild(document.createTextNode('整条路径都记下来了，提交看结果'));
      candBox.appendChild(lab);
      var t = h('p', 'seq-note');
      t.textContent = path.map(function (p) { return '(' + p[0] + ',' + p[1] + ')'; }).join(' → ');
      candBox.appendChild(t);
    }

    addPage(node, {
      lead: LEAD[2],
      hint: '逐格取最大 → 回溯 → 提交 · 计分：对上 +1 / 错配 −1 / gap −2',
      nextLabel: '提交比对',
      onEnter: function () { paint(); renderCands(); },
      onNext: function () {
        if (phase === 'fill') {
          showErr(fbf, '矩阵还没填完——还有 ' + (m * n - filled) + ' 格。');
          return;
        }
        if (phase !== 'done') { showErr(fbf, '还没回溯到左上角。'); return; }
        judge('/levels/2/judge', { dirs: dirs, path: path }, function (resp) {
          var r = resp.result || {};
          return '得分 ' + r.score + ' · 缺口在第 ' + r.gapPos1 + ' 位（' + r.missingBase +
            '）· 匹配率 ' + r.matchRate + '%';
        });
      }
    });
  }

  /* ---------- 案件三：三个嫌疑人（一页一位） ---------- */
  function buildSuspects(d) {
    var answers = {};
    var pageIdx = [];

    d.suspects.forEach(function (s, idx) {
      var node = pageHead('SUSPECT ' + (idx + 1) + ' / ' + d.suspects.length);
      var wrap = h('div', 'qz-body');

      var head = h('div', 'sp-head');
      head.appendChild(h('b', null, s.gene));
      head.appendChild(h('span', 'sp-hgvs', s.hgvs));
      head.appendChild(h('span', 'sp-type', s.type));
      wrap.appendChild(head);
      wrap.appendChild(h('div', 'sp-src', s.protein + '｜' + s.source));

      /* ACMG 证据代码：临床判变异的标准「话语」 */
      if (s.acmg && s.acmg.length) {
        var codes = h('div', 'ev-codes');
        s.acmg.forEach(function (a) {
          var chip = h('span', 'ev-code ' + (a.code.charAt(0) === 'B' ? 'benign' : 'patho'),
            a.code + ' · ' + a.kind);
          chip.title = a.text || '';
          codes.appendChild(chip);
        });
        wrap.appendChild(codes);
      }

      var ev = h('div', 'ev-grid tight');
      s.evidence.forEach(function (e) {
        var c = h('div', 'ev');
        c.appendChild(h('div', 'ev-t', e.title));
        c.appendChild(h('div', 'ev-v', e.value));
        c.appendChild(h('div', 'ev-d', e.desc));
        ev.appendChild(c);
      });
      wrap.appendChild(ev);

      var lab = h('p', 'seq-label');
      lab.style.marginTop = '2px';
      lab.appendChild(h('b', null, '你的判定'));
      lab.appendChild(document.createTextNode('这名变异属于哪一类？'));
      wrap.appendChild(lab);

      var opts = optRow(d.options, function (v) {
        answers[s.id] = v;
        clearErr(fbf);
      });
      var optBox = h('div', 'sp-opts');
      optBox.appendChild(opts.row);
      wrap.appendChild(optBox);
      node.appendChild(wrap);

      var fbf = h('p', 'fbf');
      node.appendChild(fbf);

      var last = idx === d.suspects.length - 1;
      var p = addPage(node, {
        lead: idx === 0 ? LEAD[3] : '',
        hint: '第 ' + (idx + 1) + ' 位嫌疑人 · 三人判完才能提交',
        nextLabel: last ? '提交全部判定' : '下一位 →',
        onNext: function () {
          if (!answers[s.id]) { showErr(fbf, '这位还没给结论——选一个再继续。'); return; }
          if (!last) { go(pageIdx[idx + 1]); return; }
          var miss = d.suspects.filter(function (x) { return !answers[x.id]; });
          if (miss.length) {
            go(pageIdx[d.suspects.indexOf(miss[0])]);
            setHint('「' + miss[0].gene + '」还没判。');
            return;
          }
          judge('/levels/3/judge', { answers: answers }, function (resp) {
            var keys = Object.keys(resp.results || {});
            var ok = keys.filter(function (k) { return resp.results[k].passed; }).length;
            return ok + ' / ' + keys.length + ' 名判定正确';
          }, function (resp) {
            /* 判错时把服务器推出的规则链摊出来：错在哪一条规则，比只说「错了」有用 */
            var res = resp.results || {};
            var bad = Object.keys(res).filter(function (k) { return !res[k].passed; })[0];
            if (!bad) return resp.feedback;
            var name = (d.suspects.filter(function (x) { return x.id === bad; })[0] || {}).gene || bad;
            return '「' + name + '」判错了。规则表推出的结论是「' + res[bad].verdict + '」：' + res[bad].rule;
          });
        }
      });
      pageIdx[idx] = pages.indexOf(p);
    });
  }

  /* ---------- 案件四：野生 / 患者双序列翻译 + 变异效应 ---------- */
  function buildCodon(d) {
    var node = pageHead('ACTION · 两段序列各自翻译，再判断影响');
    var wrap = h('div', 'qz-body');

    var table = h('div', 'codon-table');
    /* 同义的密码子（三个终止码）合并成一格，表格才不会撑成两行 */
    var grouped = [];
    Object.keys(d.codonTable).forEach(function (k) {
      var hit = grouped.filter(function (g) { return g.v === d.codonTable[k]; })[0];
      if (hit) hit.k += ' / ' + k;
      else grouped.push({ k: k, v: d.codonTable[k] });
    });
    grouped.forEach(function (g) {
      var chip = h('span');
      chip.appendChild(h('b', null, g.k));
      chip.appendChild(document.createTextNode(' → ' + g.v));
      table.appendChild(chip);
    });
    wrap.appendChild(table);

    var rows = Math.min(d.wildCodons.length, d.patientCodons.length);
    var head = h('div', 'cd-head');
    head.innerHTML = '<span></span><span>野生</span><span>健康人的读法</span>' +
      '<span>患者</span><span>同一个位置的读法</span>';
    wrap.appendChild(head);

    var body = h('div', 'cd-body');
    var pWild = [], pPat = [];
    for (var gi = 0; gi < rows; gi++) {
      (function (gi) {
        var row = h('div', 'cd-row');
        row.appendChild(h('span', 'cd-no', String(gi + 1)));
        row.appendChild(h('span', 'codon-code', d.wildCodons[gi]));

        var optsW = optRow(d.aminoOptions[gi] || [], function (v) {
          pWild[gi] = v; clearErr(fbf);
        });
        row.appendChild(optsW.row);

        row.appendChild(h('span', 'codon-code', d.patientCodons[gi]));
        var optsP = optRow(d.aminoOptions[gi] || [], function (v) {
          pPat[gi] = v; clearErr(fbf);
        });
        row.appendChild(optsP.row);
        body.appendChild(row);
      })(gi);
    }
    wrap.appendChild(body);

    var eLab = h('p', 'seq-label');
    eLab.style.marginTop = '14px';
    eLab.appendChild(h('b', null, '这一字之差'));
    eLab.appendChild(document.createTextNode('属于哪一类变异？'));
    wrap.appendChild(eLab);
    var effect = null;
    var effBox = h('div', 'eff-opts');
    var o = optRow(d.effects, function (v) { effect = v; clearErr(fbf); });
    effBox.appendChild(o.row);
    wrap.appendChild(effBox);
    node.appendChild(wrap);

    var fbf = h('p', 'fbf');
    node.appendChild(fbf);

    addPage(node, {
      lead: LEAD[4],
      hint: '两列各有 ' + rows + ' 组密码子，全部选完再判变异类型',
      nextLabel: '提交破译',
      onNext: function () {
        var missW = pWild.filter(function (x) { return !x; }).length;
        var missP = pPat.filter(function (x) { return !x; }).length;
        if (missW || missP) {
          showErr(fbf, '还有密码子没翻译——' +
            (missW ? '野生型缺 ' + missW + ' 组' : '') +
            (missW && missP ? '，' : '') +
            (missP ? '患者缺 ' + missP + ' 组' : '') + '。');
          return;
        }
        if (!effect) { showErr(fbf, '最后一问还没答——这一字之差属于哪类变异？'); return; }
        judge('/levels/4/judge', { wild: pWild, patient: pPat, effect: effect }, function (resp) {
          var r = resp.result || {};
          return '野生 ' + r.wildProtein + '　→　患者 ' + r.patientProtein;
        });
      }
    });
  }

  /* ---------- 案件五：CRISPR 向导设计 ---------- */
  function buildCrispr(d) {
    var node = pageHead('ACTION · 扫描 PAM、算 GC、选向导');
    var wrap = h('div', 'qz-body');
    var seq = d.sequence, L = d.guideLen, MUT = d.mutationIndex;

    /* 序列：标出变异位与全部 PAM 三联体 */
    var pamBase = {};
    d.candidates.forEach(function (c) {
      pamBase[c.pamPos + 1] = true;
      pamBase[c.pamPos + 2] = true;
    });
    var grid = h('div', 'crispr-seq');
    var cellEls = [];
    seq.split('').forEach(function (b, i) {
      var c = h('span', 'bc' + (i === MUT ? ' mut' : '') + (pamBase[i] ? ' pam' : ''));
      c.appendChild(h('span', 'lt', b));
      cellEls[i] = c;
      grid.appendChild(c);
    });
    wrap.appendChild(grid);

    var legend = h('div', 'dp-legend');
    legend.style.marginTop = '8px';
    legend.innerHTML = '<span><i style="background:rgb(201 106 114/.24);border-color:#c0392b"></i>' +
      '第 ' + (MUT + 1) + ' 位 · 变异碱基（患者 ' + d.mutationPatient + ' / 野生 ' + d.mutationWild + '）</span>' +
      '<span><i style="background:rgb(195 150 39/.24);border-color:#c39627"></i>NGG · PAM</span>';
    wrap.appendChild(legend);

    var codonNote = h('p', 'seq-note', '变异所在密码子：患者 ' + d.codon + '（野生 ' + d.codonWild +
      '）—— 第 40–42 位。本段为教学改编序列，只扫正链。');
    wrap.appendChild(codonNote);

    var buckets = {}, pick = null;

    var list = h('div', 'guide-list');
    d.candidates.forEach(function (c) {
      var card = h('div', 'guide-card');

      var top = h('div', 'guide-top');
      top.appendChild(h('b', null, 'PAM 第 ' + (c.pamPos + 1) + '–' + (c.pamPos + 3) + ' 位'));
      top.appendChild(h('span', null, c.pam));

      var pkTop = h('button', 'pick-btn', '选它');
      pkTop.type = 'button';
      top.appendChild(pkTop);
      card.appendChild(top);

      card.appendChild(h('p', 'guide-seq', c.guide));

      var bot = h('div', 'guide-bot');
      var bl = h('span', 'seq-label');
      bl.style.margin = '0';
      bl.appendChild(h('b', null, 'GC'));
      bot.appendChild(bl);

      var bs = h('div', 'buckets');
      d.buckets.forEach(function (b) {
        var btn = h('button', 'bk', b);
        btn.type = 'button';
        btn.addEventListener('click', function () {
          buckets[c.pamPos] = b;
          Array.prototype.forEach.call(bs.children, function (x) { x.classList.remove('on'); });
          btn.classList.add('on');
          clearErr(fbf);
        });
        bs.appendChild(btn);
      });
      bot.appendChild(bs);

      var pk = pkTop;
      pk.addEventListener('click', function () {
        pick = c.pamPos;
        Array.prototype.forEach.call(list.children, function (x) {
          x.classList.remove('on');
          x.querySelector('.pick-btn').classList.remove('on');
          x.querySelector('.pick-btn').textContent = '选它';
        });
        card.classList.add('on');
        pk.classList.add('on');
        pk.textContent = '已选';
        cellEls.forEach(function (el, i) {
          el.classList.toggle('guide', i >= c.pamPos - L && i < c.pamPos);
        });
        clearErr(fbf);
      });
      card.appendChild(bot);
      list.appendChild(card);
    });
    wrap.appendChild(list);
    node.appendChild(wrap);

    var fbf = h('p', 'fbf');
    node.appendChild(fbf);

    addPage(node, {
      lead: LEAD[5],
      hint: '四段都要标 GC 档位，再选一段提交',
      nextLabel: '提交设计',
      onNext: function () {
        if (Object.keys(buckets).length < d.candidates.length) {
          showErr(fbf, '还有候选没标 GC 档位——四段都要算。');
          return;
        }
        if (pick === null) { showErr(fbf, '还没选向导——挑一段你认为能用的。'); return; }
        judge('/levels/5/judge', { buckets: buckets, pick: pick }, function (resp) {
          var r = resp.result || {};
          return '向导 GC ' + r.gc + '/' + L + ' ≈ ' + r.gcPct + '% · 下刀点在 PAM 第 ' + r.pamPos1 + ' 位';
        });
      }
    });
  }

  /* ---------- 案件六：生物标志物匹配 ---------- */
  function buildRx(d) {
    var node = pageHead('ACTION · 标志物对上了，方案才成立');
    var wrap = h('div', 'qz-body');
    var choice = null;
    var v = d.variant;

    var head = h('div', 'sp-head');
    head.appendChild(h('b', null, v.gene));
    head.appendChild(h('span', 'sp-hgvs', v.hgvs));
    head.appendChild(h('span', 'sp-type', v.type));
    if (v.biomarker) head.appendChild(h('span', 'ev-code patho', '标志物 · ' + v.biomarker));
    wrap.appendChild(head);
    wrap.appendChild(h('div', 'sp-src', v.protein + '｜' + v.source));

    var ev = h('div', 'ev-grid tight');
    v.evidence.forEach(function (e) {
      var c = h('div', 'ev');
      c.appendChild(h('div', 'ev-t', e.title));
      c.appendChild(h('div', 'ev-v', e.value));
      c.appendChild(h('div', 'ev-d', e.desc));
      ev.appendChild(c);
    });
    wrap.appendChild(ev);

    var rLab = h('p', 'seq-label');
    rLab.style.marginTop = '2px';
    rLab.appendChild(h('b', null, '你的处方'));
    rLab.appendChild(document.createTextNode('哪套方案的标志物与报告对得上？'));
    wrap.appendChild(rLab);

    var list = h('div', 'rx-list');
    d.options.forEach(function (o) {
      var card = h('div', 'rx-card');
      card.appendChild(h('div', 'rx-name', o.name));
      card.appendChild(h('div', 'rx-tag', o.tag));
      card.addEventListener('click', function () {
        choice = o.id;
        Array.prototype.forEach.call(list.children, function (x) { x.classList.remove('on'); });
        card.classList.add('on');
        clearErr(fbf);
      });
      list.appendChild(card);
    });
    wrap.appendChild(list);
    node.appendChild(wrap);

    var fbf = h('p', 'fbf');
    node.appendChild(fbf);

    addPage(node, {
      lead: LEAD[6],
      hint: '三套方案选一套 · 看标志物是否吻合',
      nextLabel: '提交判定',
      onNext: function () {
        if (!choice) { showErr(fbf, '先选一套方案。'); return; }
        judge('/levels/6/judge', { choice: choice }, function (resp) {
          var r = resp.result || {};
          return '标志物吻合：' + String(r.tag || '').replace(/^要求标志物：/, '');
        });
      }
    });
  }

  var GAMES = { 1: buildTrim, 2: buildAlign, 3: buildSuspects, 4: buildCodon, 5: buildCrispr, 6: buildRx };

  /* ============================================================
     锦囊
     ============================================================ */
  var GUIDE_HEAD = {
    evidence: '证据', suspicious: '可疑（指向致病）', benign: '放心（指向良性）',
    uncertain: '存疑', range: '分值区间', color: '柱色', meaning: '含义',
    action: '处理', step: '步骤', detail: '要点'
  };

  /* 锦囊正文：`**重点**` 渲染为荧光高亮，其余原样输出 */
  function richText(v) {
    var s = String(v == null ? '' : v);
    var frag = document.createDocumentFragment();
    var re = /\*\*(.+?)\*\*/g, last = 0, m;
    while ((m = re.exec(s)) !== null) {
      if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
      frag.appendChild(h('mark', null, m[1]));
      last = m.index + m[0].length;
    }
    if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
    return frag;
  }

  /* 锦囊只留口诀表：intro / conclusion 不再渲染，重点靠表内高亮传达 */
  function renderGuide(g) {
    var btn = document.getElementById('dk-pouch');
    var rows = (g && (g.rows || g.rules)) || [];
    if (!rows.length) { btn.hidden = true; return; }
    btn.hidden = false;
    pouchBody.innerHTML = '';

    var heads = Object.keys(rows[0]);
    var table = h('table');
    var thead = h('thead');
    var hr = h('tr');
    hr.style.setProperty('--i', 0);
    heads.forEach(function (k) { hr.appendChild(h('th', null, GUIDE_HEAD[k] || k)); });
    thead.appendChild(hr);
    table.appendChild(thead);

    var tbody = h('tbody');
    rows.forEach(function (r, i) {
      var tr = h('tr');
      tr.style.setProperty('--i', i + 1);
      heads.forEach(function (k) {
        var td = h('td');
        td.appendChild(richText(r[k]));
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    pouchBody.appendChild(table);
  }

  var dkPouch = document.getElementById('dk-pouch');
  var burstTimer = 0;
  var pouchUsed = 0;                             /* 本次侦办打开锦囊的次数，结案时计入档案 */
  function openPouch() {
    pouchUsed++;
    /* 袋口先炸一下，再把整卷甩出来 */
    dkPouch.classList.remove('is-burst');
    void dkPouch.offsetWidth;
    dkPouch.classList.add('is-burst');
    pouch.classList.remove('on');
    void pouch.offsetWidth;
    clearTimeout(burstTimer);
    burstTimer = setTimeout(function () { pouch.classList.add('on'); }, 110);
  }
  function closePouch() {
    clearTimeout(burstTimer);
    pouch.classList.remove('on');
  }
  dkPouch.addEventListener('click', openPouch);
  document.getElementById('pouch-x').addEventListener('click', closePouch);
  pouch.addEventListener('click', function (e) {
    if (e.target === pouch) closePouch();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && pouch.classList.contains('on')) closePouch();
  });

  /* ============================================================
     启动
     ============================================================ */
  GD.api('/levels').then(function (levels) {
    var d = levels['level' + n];
    if (!d) { location.replace('cases.html'); return null; }
    return GD.loadProgress().then(function (p) {
      for (var i = 1; i < n; i++) {
        if (!p['level' + i]) { location.replace('cases.html'); return null; }
      }
      return { d: d, p: p };
    });
  }).then(function (ctx) {
    if (!ctx) return;
    D = ctx.d;
    solved = !!ctx.p['level' + n];

    document.title = D.caseTitle + ' · 基因侦探';
    document.getElementById('dk-no').textContent = 'CASE ' + (n < 10 ? '0' + n : n) + ' / 06';
    document.getElementById('dk-title').textContent = D.caseTitle.replace(/^案件. · /, '');
    var tag = document.getElementById('dk-tag');
    tag.textContent = TAGS[n] || '';
    tag.hidden = false;
    document.getElementById('ct-r').textContent =
      'CASE FILE · 第 ' + n + ' / 6 宗 · ' + (solved ? '已侦破' : '待侦办');

    renderGuide(D.judgementGuide);

    buildDossier(D);
    GAMES[n](D);
    go(0);
    startTimer();
  }).catch(function (e) {
    /* 别把异常吞掉：控制台留一条线索，方便定位是哪一步炸的 */
    if (window.console && console.error) console.error('[卷宗渲染失败]', e);
    document.getElementById('dk-title').textContent = '卷宗加载失败';
    document.getElementById('dk-no').textContent = 'CASE FILE · ERROR';
    var box = h('div', 'dz');
    box.appendChild(h('p', 'dz-story', (e.message || '网络异常') +
      ' —— 请确认后端已启动，再返回案件簿重试。'));
    addPage(box);
    go(0);
    btnNext.hidden = true;
    document.getElementById('dk-prev').hidden = true;
  });
})();
</script>
