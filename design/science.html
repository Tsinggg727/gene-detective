<title>手册 · 基因侦探</title>

<style>
/* ==========================================================
   科普 · 侦探须知手册（实体书）
   · 合着 → 点「点击查看手册」/ 封面 → 封面绕书脊翻开
   · 翻开后：左页正文，右页要点 + 图示；一页只讲一件事
   · 翻页：一张「纸」绕书脊转 180°，正反两面分别是前后两页
   · 目录只列题目，不写内容（想看内容就翻过去）
   ========================================================== */

/* ---------- 页头：探长的话 + 书 ---------- */
.bk-desk { padding: calc(var(--nav-h) + 46px) 0 56px;
  position: relative; text-align: center; }
.bk-desk::before { background-position: 50% 12%; opacity: .5; }
.bk-desk h2 { font-size: clamp(24px, 2.6vw, 30px); margin: 10px 0 14px; }
/* 探长的话交给开场白去说，书台上只留一行注记 */
.bk-note { display: inline-block; margin: 0 auto 10px;
  font-size: 14px; line-height: 1.7; color: var(--blue-700);
  font-style: italic; letter-spacing: .05em; }
.bk-note::before { content: "——"; margin-right: 4px; font-style: normal;
  letter-spacing: 0; color: var(--blue-700); opacity: .6; }

/* ---------- 台面 / 书 ---------- */
.bk-stage { position: relative; width: 100%;
  height: clamp(620px, calc(100vh - 260px), 830px);
  margin: 0 auto; perspective: 2800px; perspective-origin: 50% 40%; }
.bk-stage::after { content: ""; position: absolute; left: 25%; right: 25%; bottom: -14px;
  height: 26px; border-radius: 50%; z-index: 0;
  background: radial-gradient(50% 50% at 50% 50%, rgb(63 74 107 / .20), transparent 72%);
  filter: blur(7px); transition: left 900ms var(--ease-out-quart), right 900ms var(--ease-out-quart); }
.bk-stage.is-open::after { left: 3%; right: 3%; }

/* 合着时整本书居中（封面居中），翻开时向右落位，让出左边那页 */
.book { position: absolute; inset: 0; transform-style: preserve-3d;
  transform: translateX(-25%);
  touch-action: pan-y;
  transition: transform 1000ms cubic-bezier(.42, .02, .28, 1); }
.book.is-open { transform: translateX(0); }
/* 拖拽翻页时：不吃文字选中，光标提示可拖 */
.book.is-drag, .book.is-drag * { user-select: none; -webkit-user-select: none; }
.book.is-drag { cursor: grabbing; }

/* 合着时的书口（一叠纸边） */
.bk-block { position: absolute; left: 50%; top: 7px; bottom: 7px; width: calc(50% - 4px);
  border-radius: 2px 11px 11px 2px; transform: translateX(4px);
  background: repeating-linear-gradient(90deg, #fbf6ec 0 2px, #e7dcc8 2px 3px);
  box-shadow: 0 20px 34px -22px rgb(37 45 72 / .55);
  transition: opacity 300ms var(--t-state); z-index: 1; }
.book.is-pages .bk-block { opacity: 0; }

/* 书页（左右两半） */
.bk-side { position: absolute; top: 0; height: 100%; width: 50%; z-index: 2;
  background: linear-gradient(180deg, #fdfaf3 0%, #f9f3e8 62%, #f4ecdf 100%);
  opacity: 0; visibility: hidden;
  transition: opacity 280ms linear;
  overflow: hidden; }
.bk-left { left: 0; border-radius: 4px 2px 2px 6px;
  box-shadow: inset -26px 0 34px -26px rgb(63 74 107 / .55),
              -18px 26px 44px -30px rgb(37 45 72 / .5); }
.bk-right { left: 50%; border-radius: 2px 6px 6px 2px;
  box-shadow: inset 26px 0 34px -26px rgb(63 74 107 / .55),
              18px 26px 44px -30px rgb(37 45 72 / .5); }
.book.is-pages .bk-right { opacity: 1; visibility: visible; }
/* 左页与封二内容逐字相同，瞬间切换，别让底下纸色透出来 */
.book.is-lit .bk-left { opacity: 1; visibility: visible; transition: none; }
/* 合书：纸页在封面转回来的同时淡出，不要等封面落定才突然消失 */
.book.is-closing .bk-left, .book.is-closing .bk-right {
  opacity: 0 !important; visibility: visible;
  transition: opacity .4s ease .08s !important; }

/* 书脊投影 */
.bk-spine { position: absolute; left: 50%; top: 0; height: 100%; width: 34px; z-index: 3;
  transform: translateX(-50%); pointer-events: none; opacity: 0;
  transition: opacity 300ms linear;
  background: linear-gradient(90deg, transparent, rgb(63 74 107 / .10) 34%,
    rgb(63 74 107 / .22) 50%, rgb(63 74 107 / .10) 66%, transparent); }
.book.is-open .bk-spine { opacity: 1; }

/* ---------- 翻页纸 ---------- */
.bk-leaf { position: absolute; left: 50%; top: 0; width: 50%; height: 100%; z-index: 8;
  transform-origin: left center; transform-style: preserve-3d;
  will-change: transform; pointer-events: none; }
.bk-leaf[hidden] { display: none; }
.lf { position: absolute; inset: 0; overflow: hidden;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: linear-gradient(180deg, #fefbf5 0%, #faf4ea 60%, #f5eee1 100%);
  border-radius: 2px 8px 8px 2px;
  box-shadow: 0 12px 30px -16px rgb(46 56 84 / .45); }
.lf-back { transform: rotateY(180deg); border-radius: 8px 2px 2px 8px; }
.lf-front::after, .lf-back::after { content: ""; position: absolute; inset: 0;
  pointer-events: none; }
.lf-front::after { background: linear-gradient(90deg, rgb(63 74 107 / .18), transparent 22%); }
.lf-back::after { background: linear-gradient(-90deg, rgb(63 74 107 / .18), transparent 22%); }

/* ---------- 封面 ---------- */
.bk-cover { position: absolute; left: 50%; top: 0; width: 50%; height: 100%; z-index: 9;
  transform-origin: left center; transform-style: preserve-3d;
  transform: rotateY(0deg);
  transition: transform 1000ms cubic-bezier(.42, .02, .28, 1); }
.book.is-open .bk-cover { transform: rotateY(-180deg); pointer-events: none; }
.book.is-covered .bk-cover { visibility: hidden; }

.cv-face { position: absolute; inset: 0; overflow: hidden;
  backface-visibility: hidden; -webkit-backface-visibility: hidden; }

/* 正面：布面精装 */
.cv-front { border: 0; padding: 0; cursor: pointer; font-family: var(--font-body);
  display: grid; place-content: center; text-align: center;
  border-radius: 3px 12px 12px 3px;
  background:
    radial-gradient(120% 96% at 74% 6%, rgb(255 255 255 / .12), transparent 56%),
    repeating-linear-gradient(48deg, rgb(255 255 255 / .03) 0 1px, transparent 1px 3px),
    linear-gradient(152deg, #4c577d 0%, #3b4668 42%, #2d3550 100%);
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / .10),
              inset -26px 0 44px -34px rgb(0 0 0 / .8),
              0 30px 56px -26px rgb(37 45 72 / .62); }
.cv-front::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 120% at 50% 0%, transparent 52%, rgb(0 0 0 / .26) 100%); }

.cv-spine { position: absolute; left: 0; top: 0; bottom: 0; width: 28px;
  display: grid; place-items: center;
  writing-mode: vertical-rl; text-orientation: upright;
  font-family: var(--font-display); font-size: 10.5px; font-weight: 700;
  letter-spacing: .26em; color: rgb(240 228 204 / .52);
  background: linear-gradient(90deg, rgb(0 0 0 / .38), rgb(255 255 255 / .06) 64%, rgb(0 0 0 / .18));
  border-right: 1px solid rgb(240 228 204 / .18); }

.cv-frame { position: absolute; inset: 15px 13px 15px 42px;
  border: 1px solid rgb(232 214 178 / .26); border-radius: 2px 9px 9px 2px;
  pointer-events: none; }
.cv-frame::before { content: ""; position: absolute; inset: 5px;
  border: 1px solid rgb(232 214 178 / .14); border-radius: 1px 7px 7px 1px; }

.cv-in { position: relative; display: grid; justify-items: center; padding: 0 26px 0 40px; }
.cv-kick { font-size: 10px; letter-spacing: .26em; color: rgb(236 220 190 / .58); }
.cv-title { font-family: var(--font-display); font-size: clamp(30px, 3.1vw, 40px);
  font-weight: 900; letter-spacing: .16em; text-indent: .16em; line-height: 1.2;
  color: #f6eedd; margin-top: 14px;
  text-shadow: 0 1px 0 rgb(0 0 0 / .38), 0 0 22px rgb(255 240 210 / .16); }
.cv-line { width: 46px; height: 1px; background: rgb(232 214 178 / .42); margin: 20px 0 18px; }
.cv-seal { width: 92px; height: 92px; padding: 4px; border-radius: 50%;
  border: 1px solid rgb(232 214 178 / .40);
  background: radial-gradient(120% 120% at 30% 20%, rgb(255 255 255 / .12), transparent 60%); }
.cv-seal img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
  display: block; filter: saturate(.86) contrast(1.04); }

.cv-cta { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
  white-space: nowrap; text-align: center;
  font-family: var(--font-display); font-size: 14px; font-weight: 700;
  letter-spacing: .28em; text-indent: .28em;
  color: rgb(252 244 226 / 1);
  text-shadow: 0 1px 0 rgb(0 0 0 / .34);
  animation: cvPulse 3.4s var(--ease-in-out) infinite; }
@keyframes cvPulse { 0%, 100% { opacity: .7; border-color: rgb(244 231 202 / .34); }
  50% { opacity: 1; border-color: rgb(244 231 202 / .62); } }

/* 封二：扉页（与左页同内容，翻完无缝替换） */
.cv-back { transform: rotateY(180deg); border-radius: 12px 3px 3px 12px;
  background: linear-gradient(180deg, #fdfaf3 0%, #f9f3e8 62%, #f4ecdf 100%);
  box-shadow: inset 26px 0 34px -26px rgb(63 74 107 / .5); }

/* 合着时：探长的话在页面上方，书居中；点封面翻开（不做额外按钮） */

/* ---------- 书页排版：整页排满，不出滚动条 ---------- */
.pg { height: 100%; padding: 28px 32px 22px; display: flex; flex-direction: column;
  overflow: hidden; text-align: left; }
.bk-left .pg { padding-right: 38px; }
.bk-right .pg { padding-left: 38px; }

.pg-run { display: flex; align-items: center; justify-content: space-between; gap: 10px;
  flex: none; padding-bottom: 8px;
  border-bottom: 1px solid rgb(var(--wc-blue-deep) / .14);
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; color: var(--text-3); }
.pg-run b { font-weight: 700; color: var(--blue-500); }

.pg-title { font-family: var(--font-display); font-size: 27px; font-weight: 900;
  line-height: 1.3; color: var(--blue-900); margin: 15px 0 5px; flex: none; }
.pg-hook { font-size: 13px; font-weight: 600; color: var(--blue-900); flex: none;
  margin-bottom: 14px; }

/* 探长原话：引文版式，左边一道竖线，不做气泡卡片 */
.pg-say { flex: none; margin: 0 0 14px; padding: 1px 0 1px 14px;
  border-left: 2px solid rgb(var(--wc-blue) / .5); }
.pg-say p { font-family: var(--font-display); font-size: 14.5px; line-height: 1.9;
  color: var(--blue-700); }

.pg-text { font-size: 14.8px; line-height: 2.0; color: var(--text-2);
  text-indent: 2em; margin: 0 0 10px; flex: none; }

/* 三条要点：编号悬排 + 上方细线，像书里的一行行字 */
.pg-points { list-style: none; flex: none; margin: 4px 0 0; padding-top: 13px;
  border-top: 1px solid rgb(var(--wc-blue-deep) / .13); }
.pg-points li { position: relative; padding-left: 26px; margin-bottom: 4px;
  font-size: 13.4px; line-height: 1.9; color: var(--text-2); }
.pg-points li:last-child { margin-bottom: 0; }
.pg-points li b { position: absolute; left: 0; top: 1px;
  font-family: var(--font-display); font-size: 12.5px; font-weight: 700; color: var(--blue-700); }
.pg-points li em { font-style: normal; font-weight: 700; color: var(--blue-900);
  margin-right: 6px; }
.pg-points mark { color: inherit; padding: 0 2px; margin: 0 -2px;
  background: linear-gradient(transparent 60%, rgb(255 214 102 / .5) 0); }

.pg-foot { margin-top: auto; padding-top: 12px; display: flex; justify-content: space-between;
  gap: 10px; font-family: var(--font-mono); font-size: 10px; color: var(--text-3);
  letter-spacing: .08em; flex: none; }

/* 扉页 */
.pg-fly { justify-content: center; align-items: center; text-align: center; gap: 0; }
.fly-title { font-family: var(--font-display); font-size: 34px; font-weight: 900;
  letter-spacing: .16em; text-indent: .16em; color: var(--blue-900); }
.fly-sub { margin-top: 12px; font-size: 10.5px; letter-spacing: .22em; color: var(--text-3); }
.fly-rule { width: 40px; height: 1px; background: rgb(var(--wc-blue-deep) / .3); margin: 26px 0; }
.fly-gift { position: relative; font-family: var(--font-display); font-size: 14.5px;
  line-height: 2.1; color: var(--text-2); }
.fly-sign { margin-top: 24px; display: inline-flex; align-items: center; gap: 7px;
  font-size: 11.5px; color: var(--blue-700); font-weight: 700; }
.fly-sign img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
.fly-sign span { font-weight: 400; color: var(--text-3); }
/* 目录 */
.toc-h { font-family: var(--font-display); font-size: 24px; font-weight: 900;
  color: var(--blue-900); margin: 18px 0 4px; letter-spacing: .12em; }
.toc-note { font-size: 11.5px; color: var(--text-3); margin-bottom: 18px; }
.toc-list { list-style: none; display: grid; gap: 2px; }
.toc-item { display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 11px 4px; border: 0; background: none; cursor: pointer; text-align: left;
  border-bottom: 1px dashed rgb(var(--wc-blue-deep) / .16);
  font-family: inherit; transition: background 180ms, padding-left 180ms; }
.toc-item:hover { background: rgb(var(--wc-blue) / .10); padding-left: 8px; }
.toc-item i { flex: none; width: 22px; font-family: var(--font-mono); font-size: 11px;
  font-style: normal; font-weight: 700; color: var(--blue-500); }
.toc-item b { flex: 1; min-width: 0; font-size: 14.5px; font-weight: 700; color: var(--blue-900);
  font-family: var(--font-body); }
.toc-item .tt { flex: none; font-size: 10px; font-family: var(--font-mono);
  color: var(--text-3); padding: 1px 6px; border-radius: 5px;
  border: 1px solid rgb(84 106 156 / .2); }
.toc-item .tt.must { color: var(--violet-500); border-color: rgb(var(--wc-violet-deep) / .34); }
.toc-item .ck { flex: none; width: 14px; text-align: center; font-size: 11px;
  color: var(--benign); opacity: 0; font-weight: 700; }
.toc-item.done .ck { opacity: 1; }
.toc-item.done b { color: var(--blue-700); }

/* 右页：图示 + 动作 */
.pg-fig { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; overflow: hidden; }
.pg-fig > div { width: 100%; }
.pg-fig .k-fig { width: 100%; padding: 15px 13px 11px;
  border-radius: 16px 13px 18px 14px; }
.pg-fig .fig-cap { margin-top: 8px; font-size: 11.5px; letter-spacing: .02em;
  font-weight: 700; opacity: .85; }

.pg-acts { flex: none; margin-top: 10px; padding-top: 10px; display: flex; align-items: center;
  gap: 16px; flex-wrap: wrap; border-top: 1px solid rgb(var(--wc-blue-deep) / .14); }
.pg-tail { flex: none; font-family: var(--font-mono); font-size: 11px; color: var(--text-3);
  margin-bottom: 4px; letter-spacing: .02em; }

/* 动作：文字链，不做按钮块 */
.act { font-family: var(--font-body); font-size: 12.5px; font-weight: 700;
  color: var(--blue-700); background: none; border: 0; padding: 2px 0 3px; cursor: pointer;
  text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
  border-bottom: 1px dashed rgb(var(--wc-blue-deep) / .35);
  transition: color var(--t-state), border-color var(--t-state); }
.act:hover { color: var(--blue-900); border-bottom-color: rgb(var(--wc-blue-deep) / .7); }
.act .ic { width: 12px; height: 12px; transition: transform var(--t-state); }
.act-try:hover .ic { transform: translateX(3px); }
.act-arch { margin-left: auto; color: var(--violet-500); cursor: default;
  border-bottom-color: rgb(var(--wc-violet-deep) / .4); }
.act-arch.done { color: var(--benign); border-bottom-color: transparent; cursor: default; }
.act-try.is-off { color: var(--text-3); border-bottom-color: rgb(84 106 156 / .2); }

/* ---------- 书页内：左下「返回目录」/ 右上「×」 ---------- */
.pg-back { font-family: var(--font-body); font-size: 10.5px; font-weight: 700;
  color: var(--blue-700); cursor: pointer; background: none; border: none;
  padding: 2px 0; border-bottom: 1px dashed rgb(var(--wc-blue-deep) / .35);
  letter-spacing: .08em;
  transition: color var(--t-state), border-color var(--t-state); }
.pg-back:hover { color: var(--blue-900); border-color: rgb(var(--wc-blue-deep) / .6); }
.pg-x { width: 24px; height: 24px; display: grid; place-items: center; cursor: pointer;
  font-size: 14px; line-height: 1; color: var(--blue-700);
  border: 1px solid rgb(var(--wc-blue-deep) / .22); border-radius: 50%;
  background: rgb(255 253 248 / .6); transition: all var(--t-state); }
.pg-x:hover { color: var(--blue-900); background: #fffdf8;
  border-color: rgb(var(--wc-blue-deep) / .5); }

/* ---------- 提示条 ---------- */
.toast { position: fixed; left: 50%; bottom: 34px; z-index: 200; max-width: calc(100% - 36px);
  padding: 12px 20px; text-align: center; font-size: 13px; line-height: 1.6;
  color: var(--blue-900); border-radius: 14px 18px 13px 17px;
  background: linear-gradient(180deg, #fffdf8, #fbf6ee);
  border: 1px solid rgb(var(--wc-blue-deep) / .22);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .9), 0 18px 40px -18px rgb(63 74 107 / .5);
  opacity: 0; transform: translate(-50%, 16px); pointer-events: none;
  transition: opacity 280ms, transform 340ms var(--ease-out-quart); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- 图示（缩到半页宽） ---------- */
.k-fig { position: relative;
  background:
    radial-gradient(120% 130% at 82% 12%, rgb(var(--wc-violet) / .10), transparent 62%),
    rgb(var(--wc-blue) / .09);
  border: 1px solid rgb(var(--wc-blue-deep) / .10); }
.fig-cap { font-family: var(--font-mono); color: var(--blue-900); text-align: center; }

/* 第 1 页 · 套娃 */
.nest { position: relative; border: 1.4px solid rgb(var(--wc-blue-deep) / .42);
  border-radius: 12px 16px 11px 14px; padding: 25px 13px 13px; }
.nest .nt { position: absolute; top: 8px; left: 13px; font-size: 11px; font-weight: 700;
  color: var(--blue-700); letter-spacing: .1em; }
.n1 { background: rgb(255 253 248 / .7); }
.n2 { border-radius: 11px 14px 10px 13px; background: rgb(var(--wc-blue) / .13); }
.n3 { border-radius: 10px 12px 9px 11px; background: rgb(var(--wc-blue) / .19); }
.n4 { display: grid; place-items: center; gap: 2px; padding: 15px 0 12px;
  border-radius: 9px 11px 8px 10px; background: rgb(var(--wc-blue) / .25); }
.n4 .ic { width: 32px; height: 32px; stroke: var(--blue-700); stroke-width: 1.3;
  animation: nn 5s var(--ease-in-out) infinite; }
.n4 span { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .18em;
  color: var(--blue-700); }
@keyframes nn { 0%, 100% { transform: rotateY(0) } 50% { transform: rotateY(180deg) } }
.nest-note { display: flex; justify-content: space-between; margin-top: 9px;
  font-family: var(--font-mono); font-size: 11px; color: var(--text-3); }

/* 第 2 页 · 打分柱 */
.q-wrap { display: flex; align-items: flex-end; gap: 2px; height: 104px;
  padding: 0 3px; position: relative; }
.q-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
  align-items: center; gap: 3px; height: 100%; }
.q-bar { width: 100%; border-radius: 2px 2px 1px 1px; min-height: 4px; }
.q-col b { font-family: var(--font-mono); font-size: 10px; color: var(--text-2); font-weight: 700; }
.q-cut { position: absolute; top: -2px; bottom: 14px; width: 0;
  border-left: 1.4px dashed var(--pathogenic); }
.q-cut::after { content: "从这里剪"; position: absolute; top: -14px; left: 4px;
  font-size: 10.5px; color: var(--pathogenic); font-weight: 700; white-space: nowrap; }
.q-legend { display: flex; gap: 10px; margin-top: 10px; font-size: 11px;
  color: var(--text-3); font-family: var(--font-mono); flex-wrap: wrap; }
.q-legend i { display: inline-block; width: 7px; height: 7px; border-radius: 2px;
  margin-right: 4px; vertical-align: 0; }

/* 第 3 页 · 比对 */
.aln { display: flex; flex-direction: column; gap: 5px; }
.aln-row { display: flex; align-items: center; gap: 5px; }
.aln-row .tag { width: 32px; flex: none; font-size: 11px; font-weight: 700;
  color: var(--text-3); font-family: var(--font-mono); text-align: right; }
.aln-cells { display: grid; grid-template-columns: repeat(14, 1fr); gap: 2px; flex: 1; }
.aln-cells i { display: grid; place-items: center; height: 21px; border-radius: 3px;
  font-family: var(--font-mono); font-size: 11px; font-style: normal; font-weight: 700;
  color: var(--text-2); background: rgb(255 253 248 / .8); }
.aln-cells i.gap { background: transparent; border: 1px dashed var(--vus); color: var(--vus); }
.aln-cells i.mm { background: rgb(201 106 114 / .2); color: var(--pathogenic);
  box-shadow: inset 0 0 0 1px rgb(201 106 114 / .5); }
.aln-tip { display: flex; justify-content: space-between; margin-top: 10px;
  font-family: var(--font-mono); font-size: 11px; color: var(--text-3); }
.aln-tip b { color: var(--benign); }

/* 第 4 页 · 证据 → AI */
.ev-chips { display: grid; gap: 6px; }
.ev-chips span { display: flex; justify-content: space-between; gap: 8px;
  font-size: 12px; color: var(--text-2); padding: 6px 10px;
  border-radius: 9px 12px 8px 11px; background: rgb(255 253 248 / .78);
  border: 1px solid rgb(var(--wc-blue-deep) / .12); }
.ev-chips span b { font-family: var(--font-mono); color: var(--pathogenic); font-size: 11px; }
.ev-flow { display: grid; place-items: center; margin: 7px 0; color: var(--blue-500); }
.ev-flow .ic { width: 16px; height: 16px; }
.ev-score { display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  border-radius: 14px 11px 15px 12px; background: rgb(255 253 248 / .82);
  border: 1px solid rgb(var(--wc-blue-deep) / .12); }
.ring { position: relative; width: 50px; height: 50px; flex: none; border-radius: 50%;
  display: grid; place-items: center;
  background: conic-gradient(var(--pathogenic) 0 92%, rgb(201 106 114 / .16) 92% 100%); }
.ring::after { content: ""; position: absolute; width: 38px; height: 38px; border-radius: 50%;
  background: #faf6ee; }
.ring b { position: relative; z-index: 1; font-family: var(--font-mono); font-size: 14px;
  color: var(--pathogenic); }
.ev-score div span { display: block; font-size: 11px; color: var(--text-3); }
.ev-score div b { font-size: 12.5px; color: var(--pathogenic); }

/* 第 5 / 6 页 · 场景行 */
.scenes { display: grid; gap: 6px; }
.scene { display: flex; align-items: center; gap: 9px; padding: 9px 11px;
  border-radius: 10px 12px 9px 11px; background: rgb(255 253 248 / .76);
  border: 1px solid rgb(var(--wc-blue-deep) / .11); }
.scene .ic { width: 17px; height: 17px; stroke: var(--blue-700); flex: none; }
.scene b { font-size: 12.5px; color: var(--blue-900); display: block; line-height: 1.5; }
.scene span { font-size: 11px; color: var(--text-3); }
.scene em { margin-left: auto; font-style: normal; font-size: 10px; font-family: var(--font-mono);
  color: var(--blue-700); padding: 2px 6px; border-radius: 5px; background: rgb(var(--wc-blue) / .16); }
.coop { margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 7px;
  font-size: 11.5px; font-weight: 700; color: var(--blue-700);
  padding: 7px; border-radius: 9px; background: rgb(var(--wc-blue) / .14); }
.coop .ic { width: 13px; height: 13px; }

/* 第 7 页 · 五步流程 */
.steps5 { display: flex; align-items: stretch; gap: 3px; }
.step5 { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 9px 3px; border-radius: 9px 11px 8px 10px;
  background: rgb(255 253 248 / .7); border: 1px solid rgb(var(--wc-blue-deep) / .1);
  position: relative; }
.step5.you { background: rgb(var(--wc-blue) / .24); border-color: rgb(var(--wc-blue-deep) / .3); }
.step5 .ic { width: 16px; height: 16px; stroke: var(--blue-700); }
.step5 b { font-size: 10.5px; color: var(--blue-900); text-align: center; line-height: 1.35; }
.step5 em { position: absolute; top: -6px; right: -2px; font-style: normal; font-size: 8.5px;
  font-weight: 700; color: #fffdf8; background: var(--violet-500);
  padding: 1px 4px; border-radius: 4px 6px 3px 5px; }
.steps5 .ar { align-self: center; color: var(--blue-300); flex: none; }
.steps5 .ar .ic { width: 10px; height: 10px; }

/* 第 5 页 · 密码子翻译 */
.cd-wrap { display: grid; gap: 7px; }
.cd-row { display: flex; align-items: center; gap: 10px; }
.cd-codon { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; flex: none; width: 108px; }
.cd-codon i { display: grid; place-items: center; height: 24px; border-radius: 4px;
  font-family: var(--font-mono); font-style: normal; font-weight: 700; font-size: 12px;
  color: var(--text-2); background: rgb(255 253 248 / .85);
  border: 1px solid rgb(var(--wc-blue-deep) / .14); }
.cd-ar { width: 14px; height: 14px; flex: none; color: var(--blue-500); }
.cd-aa { font-size: 12px; font-weight: 700; color: var(--blue-900); }
.cd-aa.start { color: var(--benign); }
.cd-aa.stop { color: var(--pathogenic); }

/* 第 6 页 · 三代系谱 */
.ped-svg { width: 100%; max-width: 400px; margin: 0 auto; display: block; }
/* 系谱页整体上移一点：图与图注一起，不挤上方标题 */
.pg-fig:has(.ped-svg) .k-fig, .pg-fig:has(.ped-svg) .fig-cap { transform: translateY(-10px); }
.ped-svg line { stroke: rgb(var(--wc-blue-deep) / .5); stroke-width: 1.5; stroke-linecap: round; }
.ped-svg line.mar { stroke-width: 2; }
.ped-svg rect, .ped-svg circle { fill: #fffdf8;
  stroke: rgb(var(--wc-blue-deep) / .68); stroke-width: 1.6; }
.ped-svg .dis { fill: rgb(206 112 122 / .78); stroke: #a0535d; }
/* SVG 文字按 viewBox 260 → 400 渲染（×1.54），7.5px 落地约 11.5px，与图注一致 */
.ped-svg text { font-family: var(--font-body); font-size: 7.5px; font-weight: 600;
  fill: var(--text-2); text-anchor: middle; }
.ped-svg text.gen { font-family: var(--font-mono); font-size: 7.5px; font-weight: 700;
  fill: rgb(var(--wc-blue-deep) / .55); text-anchor: start; }
.ped-legend { display: flex; gap: 16px; margin-top: 9px; justify-content: center;
  font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; color: var(--text-2); }
.ped-legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px;
  border: 1.5px solid rgb(var(--wc-blue-deep) / .68); background: #fffdf8; vertical-align: -1px; }
.ped-legend i.sq { border-radius: 2px; }
.ped-legend i.ci { border-radius: 50%; }
.ped-legend i.dis { background: rgb(206 112 122 / .78); border-color: #a0535d; }

/* ---------- 窄屏：单页模式 ---------- */
@media (max-width: 900px) {
  .bk-desk { padding-top: calc(var(--nav-h) + 20px); }
  .bk-note { font-size: 12.5px; }
  .bk-stage { height: auto; perspective: 1600px; }
  .bk-stage::after { display: none; }
  .book { position: relative; inset: auto; height: clamp(500px, 76vh, 660px);
    margin-top: 12px; transform: none; }
  .bk-block { display: none; }
  .bk-spine { display: none; }
  .bk-left { display: none; }
  .bk-right { left: 0; width: 100%; border-radius: 3px 10px 10px 3px;
    box-shadow: 0 22px 40px -30px rgb(37 45 72 / .6),
                inset 14px 0 22px -20px rgb(63 74 107 / .45); }
  .bk-cover, .bk-leaf { left: 0; width: 100%; }
  .cv-front { border-radius: 3px 10px 10px 3px; }
  .cv-frame { inset: 13px 12px 13px 38px; }
  .cv-in { padding: 0 18px 0 34px; }
  .cv-title { font-size: 30px; }
  .cv-line { margin: 17px 0 15px; }
  .cv-seal { width: 74px; height: 74px; }
  .cv-cta { bottom: 18px; font-size: 13px; letter-spacing: .24em; }
  .pg { padding: 20px 20px 16px; }
  .bk-left .pg, .bk-right .pg { padding: 20px 20px 16px; }
  .pg-title { font-size: 22px; margin-top: 13px; }
  .pg-text { font-size: 14.2px; line-height: 1.95; }
  .q-wrap { height: 88px; }
}
@media (max-height: 780px) {
  .pg { padding-top: 22px; padding-bottom: 18px; }
  .pg-title { font-size: 24px; margin-top: 12px; }
  .pg-hook { margin-bottom: 10px; }
  .pg-say { margin-bottom: 10px; }
  .pg-say p { font-size: 13.5px; line-height: 1.8; }
  .pg-text { font-size: 14px; line-height: 1.9; margin-bottom: 8px; }
  .pg-points { padding-top: 10px; }
  .pg-points li { font-size: 12.8px; line-height: 1.8; }
  .pg-foot { padding-top: 8px; }
  /* 窄屏 SVG 更小（约 310px，×1.19），字号提到 9.5px 才能维持图注同级大小 */
  .ped-svg text { font-size: 9.5px; }
}
@media (prefers-reduced-motion: reduce) {
  .bk-cover, .bk-leaf, .cv-cta { transition: none !important; animation: none !important; }
}
</style>

<script>
function gdUserKey(base){var u='';try{u=(window.GD&&GD.getUser())||'';}catch(e){u='';}if(u&&typeof u==='object')u=u.username||'';return base+(u||'guest');}

/* ==========================================================
   科普页 · 开场交代（探长把手册递过来）
   只在第一次进页面时播；之后要点「让探长再说一遍」才播
   ========================================================== */
(function () {
  'use strict';

  var LINES = [
    '这本《侦探须知》是我特意给你备的，收好。往后办案拿不准的时候，它顶得上半个师父。',
    '一共九页：四页打地基，两页教破案新招，两页开眼界，最后一页把全程串起来。目录上只写了题目，想看得细一点，随时翻开就好。',
    '哪页要紧、哪页可以先跳过，我在页边都替你标好了。慢慢看，读完一页点一下「已读」，对应的案子自然就开了。',
    '那就这样，我替你翻开第一页——讲基因的。看完这一页，后面几页你就能看明白了。'
  ];

  function play() {
    GDGate.play({
      lines: LINES,
      /* 换新键名：老键名会被上一次「看过」的记录挡住，开场白就再也不出现了 */
      key: gdUserKey('gd_manual_intro_v2_'),
      endLabel: '收下这本手册',
      onFinish: function (skipped) {
        /* 跳过的人自己动手翻，不替他做主 */
        if (!skipped && window.GDManual) GDManual.open();
      }
    });
  }

  var btn = document.getElementById('brief-replay');
  if (btn) btn.addEventListener('click', play);

  /* 第一次自动播，之后安静等着 */
  var seen = false;
  try { seen = localStorage.getItem(gdUserKey('gd_manual_intro_v2_')) === '1'; } catch (e) { seen = false; }
  if (!seen) setTimeout(play, 480);
})();
</script>
